[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pitlane"
dynamic = ["version"]
description = "Formula 1 in your terminal: live timing, standings, results and the season calendar."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "bilal-psd" }]
requires-python = ">=3.8"
dependencies = []
keywords = ["f1", "formula1", "formula-1", "live-timing", "terminal", "cli", "tui"]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/bilal-psd/pitlane"
Issues = "https://github.com/bilal-psd/pitlane/issues"

[project.scripts]
pitlane = "pitlane:main"

[tool.setuptools]
py-modules = ["pitlane"]

[tool.setuptools.dynamic]
version = { attr = "pitlane.__version__" }
